name: Linux core and CLI

on:
  push:
    branches: ['linux/**']
  pull_request:
    branches: ['linux/**']

permissions:
  contents: read

jobs:
  linux-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build libraries and CLI
        run: dotnet build WolvenKit.CLI/WolvenKit.CLI.csproj --configuration Release
      - name: Run portable unit tests and generated archive round trip
        run: dotnet test Tests/WolvenKit.UnitTests/WolvenKit.UnitTests.csproj --configuration Release --framework net10.0 --logger "console;verbosity=normal"
      - name: Run Linux desktop app tests (headless)
        run: dotnet test WolvenKit.Linux.sln --configuration Release --logger "console;verbosity=normal"
